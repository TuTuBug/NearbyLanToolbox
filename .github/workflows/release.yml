name: Release

# 打 v* 形式的 tag 时自动发版：Windows exe + macOS zip + Linux tar.gz 一次发齐。
# 也可以在 Actions 页面手动触发，用于验证构建链路（勾选 dry_run 时不创建 Release）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/更新的 tag（如 v1.6）"
        required: true
      dry_run:
        description: "只构建，不创建 Release"
        type: boolean
        default: false

permissions:
  contents: write
  # 构建失败时把日志发到 Issue（Issue 公开可读，而 Actions 的日志接口
  # 对公开仓库也要求认证，外部无法直接获取）
  issues: write

jobs:
  # ---------- Windows：编译单文件 exe ----------
  windows-exe:
    name: 构建 Windows exe
    runs-on: windows-latest
    # exe 构建失败不应该挡住 mac / linux 发布。
    # 失败原因靠「把构建拆成三步」定位：每一步的成败在页面上直接可见，
    # 不依赖日志（Actions 的日志接口对公开仓库也要求认证，外部拿不到）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 记录构建环境
        shell: powershell
        run: |
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "OS: $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "区域设置代码页: $((Get-Culture).TextInfo.ANSICodePage)"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -property installationVersion
            & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe"
          } else {
            Write-Host "没有 vswhere"
          }
          $refPack = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8"
          Write-Host "net48 Developer Pack 存在: $(Test-Path $refPack)"

      # 注意：用系统自带的 Windows PowerShell 5.1（powershell），不是 PowerShell 7。
      # 本项目构建脚本一直在 5.1 下开发验证，fetch-deps 依赖 System.Net.WebClient
      # 与 System.IO.Compression，跨运行时差异会带来额外变量。

      - name: 1/3 还原依赖
        shell: powershell
        run: |
          $log = "01-fetch-deps.log"
          try {
            & .\tools\fetch-deps.ps1 *>&1 | Tee-Object -FilePath $log
          } catch {
            ($_ | Out-String) | Add-Content $log
            Write-Host "===== 依赖还原失败 ====="
            Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 50 | Write-Host
            exit 1
          }
          foreach ($f in @("deps\zxing.dll", "deps\Microsoft.Web.WebView2.Core.dll", "deps\reference-assemblies\.NETFramework\v4.8\mscorlib.dll")) {
            if (-not (Test-Path $f)) {
              Write-Host "缺少 $f"
              exit 1
            }
          }

      - name: 2/3 内嵌前端资源
        shell: powershell
        run: |
          $log = "02-embed-assets.log"
          try {
            & .\tools\embed-assets.ps1 *>&1 | Tee-Object -FilePath $log
          } catch {
            ($_ | Out-String) | Add-Content $log
            Write-Host "===== 内嵌前端资源失败 ====="
            Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 50 | Write-Host
            exit 1
          }
          if (-not (Test-Path "native\EmbeddedAssets.g.cs")) { exit 1 }

      - name: 3/3 编译
        shell: powershell
        run: |
          $log = "03-msbuild.log"
          try {
            & .\build.ps1 -SkipDeps *>&1 | Tee-Object -FilePath $log
          } catch {
            ($_ | Out-String) | Add-Content $log
          }
          if (Test-Path "outputs\NearbyLanToolbox.exe") { exit 0 }
          Write-Host "===== 编译失败，输出末尾 ====="
          Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 60 | Write-Host
          exit 1

      - name: 校验产物并记录校验和
        shell: powershell
        run: |
          $exe = "outputs\NearbyLanToolbox.exe"
          $info = Get-Item $exe
          Write-Host "产物：$exe"
          Write-Host ("大小：{0:N0} 字节" -f $info.Length)
          if ($info.Length -lt 500KB) { throw "产物过小，构建可能不完整" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NearbyLanToolbox.exe" | Out-File -Encoding utf8 release-checksum.txt
          Write-Host "SHA256：$hash"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exe
          if-no-files-found: ignore
          path: |
            outputs/NearbyLanToolbox.exe
            release-checksum.txt
            01-fetch-deps.log
            02-embed-assets.log
            03-msbuild.log

      # 失败时把日志暴露成「无需登录也能读」的形式。
      # 之所以这么绕：Actions 的 job 日志接口对公开仓库也要求认证，
      # 而 ::error:: 注解实测容易被忽略或截断。
      - name: 失败诊断
        if: failure()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $combined = @()
          foreach ($f in @("01-fetch-deps.log", "02-embed-assets.log", "03-msbuild.log")) {
            if (Test-Path $f) {
              $combined += "===== $f ====="
              $combined += @(Get-Content $f)
            }
          }
          if ($combined.Count -eq 0) { $combined = @("（没有生成任何日志）") }

          $summaryPath = $env:GITHUB_STEP_SUMMARY
          if ($summaryPath) {
            "## Windows 构建失败日志" | Out-File -FilePath $summaryPath -Append -Encoding utf8
            "" | Out-File -FilePath $summaryPath -Append -Encoding utf8
            '```text' | Out-File -FilePath $summaryPath -Append -Encoding utf8
            $combined | Select-Object -Last 200 | Out-File -FilePath $summaryPath -Append -Encoding utf8
            '```' | Out-File -FilePath $summaryPath -Append -Encoding utf8
          }

          # 发到 Issue：公开可读，外部无需 token 也能拿到完整日志
          $body = @("# Windows 构建诊断", "", "tag: $env:GITHUB_REF_NAME", "", '```text') +
                  $combined + @('```')
          $body | Out-File -FilePath ci-diagnostics.md -Encoding utf8
          try {
            gh issue create --repo $env:GITHUB_REPOSITORY `
              --title "[CI 诊断] Windows 构建失败（$env:GITHUB_REF_NAME）" `
              --body-file ci-diagnostics.md
            Write-Host "诊断日志已发到 Issue"
          } catch {
            Write-Host "创建诊断 Issue 失败：$_"
          }
          exit 0

  # ---------- macOS / Linux：打包跨平台发布包 ----------
  unix-packages:
    name: 打包 macOS / Linux 发布包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 单元测试（跨平台模块）
        run: |
          node tools/test-arp-parser.js
          node tools/test-access.js

      - name: 打包
        run: python3 tools/pack-release.py

      - name: 校验压缩包里的可执行权限位
        run: |
          python3 - <<'PY'
          import sys, tarfile, zipfile

          failed = False
          with zipfile.ZipFile("outputs/NearbyLanToolbox-mac.zip") as z:
              for info in z.infolist():
                  if info.filename.endswith((".command", ".sh")):
                      mode = (info.external_attr >> 16) & 0o777
                      ok = bool(mode & 0o100)
                      failed |= not ok
                      print(f"{'OK ' if ok else 'BAD'} {oct(mode)}  {info.filename}")

          with tarfile.open("outputs/NearbyLanToolbox-linux.tar.gz") as t:
              for member in t.getmembers():
                  if member.name.endswith((".command", ".sh")):
                      ok = bool(member.mode & 0o100)
                      failed |= not ok
                      print(f"{'OK ' if ok else 'BAD'} {oct(member.mode)}  {member.name}")

          if failed:
              sys.exit("压缩包里缺少可执行位，macOS/Linux 用户解压后无法双击启动")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: unix
          if-no-files-found: error
          path: outputs/*

  # ---------- 汇总发版 ----------
  release:
    name: 创建 Release
    needs: [windows-exe, unix-packages]
    if: always() && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "将要发布的 tag：$TAG"
          echo "目标仓库：$REPO"
          ls -la dist
          if [ -z "$(ls -A dist)" ]; then
            echo "没有任何构建产物，放弃发布"
            exit 1
          fi
          # 必须显式指定 --repo：本 job 没有 checkout，工作目录不是 git 仓库，
          # 不指定时 gh 会报「not a git repository」而失败。
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release 已存在，改为覆盖上传产物"
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi

      - name: 结果
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release view "$TAG" --repo "$REPO"

  # dry_run 时的兜底：构建完就直接结束，产物留在 Actions 页面上可下载
  summary:
    name: 构建结果（未发布）
    needs: [windows-exe, unix-packages]
    if: always() && inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - run: echo "dry_run 模式：构建完成，未创建 Release，产物见上方 Artifacts。"
