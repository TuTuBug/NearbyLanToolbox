name: Build & Release

# 触发方式：
#   · push 到 main      -> 只构建、不发版（用于验证构建链路）
#   · push v* 标签      -> 构建 + 创建/更新 Release
#   · 手动 workflow_dispatch -> 可指定 tag，勾选 dry_run 时只构建不发版
#
# 为什么不在这里删标签重建：反复删除并重建同一个 tag 会让已发布的 Release
# 一起消失（本项目踩过这个坑）。要重新发版请推新 tag，或走手动触发。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/更新的 tag"
        required: true
      dry_run:
        description: "只构建，不创建 Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ---------- Windows：编译单文件 exe ----------
  windows-exe:
    name: 构建 Windows exe
    runs-on: windows-latest
    # exe 构建失败不阻塞 mac / linux 发布。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # 构建全程由 bash 驱动、全量输出 tee 到 build.log。
      #
      # 为什么不在 workflow 里逐个调用 PowerShell 脚本并靠管道收集输出：
      # PowerShell 5.1 的流捕获在脚本内部 throw 时会丢内容，曾导致
      # 「步骤显示失败、但日志是空的」，完全无法定位。bash 的 tee 在这里
      # 是可靠的一方；PowerShell 只作为被调用的子进程。
      - name: 构建（全量日志落盘）
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "########## 环境 ##########"
            echo "ref      : $GITHUB_REF  ($GITHUB_REF_TYPE)"
            echo "sha      : $GITHUB_SHA"
            echo "runner   : $RUNNER_OS"
            echo "--- 仓库根目录 ---"
            ls -la
            echo "--- powershell 版本 ---"
            powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString(); (Get-Culture).TextInfo.ANSICodePage'
            echo "--- node 版本 ---"
            node --version

            echo ""
            echo "########## 1/3 还原依赖 ##########"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/fetch-deps.ps1
            echo "[1/3 exit=$?]"

            echo ""
            echo "########## 依赖布局 ##########"
            echo "--- deps 顶层 ---"
            ls -la deps/
            echo "--- deps/*.dll ---"
            ls -la deps/*.dll 2>&1
            echo "--- reference-assemblies 里的 targets ---"
            find deps/reference-assemblies -name "*.targets" 2>/dev/null
            echo "--- reference-assemblies 里的 mscorlib.dll ---"
            find deps/reference-assemblies -name "mscorlib.dll" 2>/dev/null
            echo "--- reference-assemblies 前 3 层 ---"
            find deps/reference-assemblies -maxdepth 3 2>/dev/null | head -40

            echo ""
            echo "########## 2/3 内嵌前端资源 ##########"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/embed-assets.ps1
            echo "[2/3 exit=$?]"
            ls -la native/EmbeddedAssets.g.cs

            echo ""
            echo "########## 校验内嵌资源与 public 一致 ##########"
            node tools/verify-embedded-assets.js
            echo "[verify exit=$?]"

            echo ""
            echo "########## 3/3 编译 ##########"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./build.ps1 -SkipDeps -SkipEmbed
            echo "[3/3 exit=$?]"

            echo ""
            echo "########## 产物 ##########"
            ls -la outputs/ 2>&1 || echo "(outputs 不存在)"
          } 2>&1 | tee build.log

          # 产物校验与校验和也放在这条 bash 流程里。
          # 之前单独用 PowerShell 步骤做这件事时它莫名失败，而关键路径上多一个
          # 运行时就是多一个变量 —— 这里只用 bash 自带工具，行为完全可预期。
          echo ""
          echo "########## 产物校验 ##########" | tee -a build.log
          if [ ! -f outputs/NearbyLanToolbox.exe ]; then
            echo "结论：构建失败，完整日志见 ci-logs 分支的 build.log" | tee -a build.log
            exit 1
          fi
          SIZE=$(stat -c%s outputs/NearbyLanToolbox.exe)
          echo "NearbyLanToolbox.exe：$SIZE 字节" | tee -a build.log
          if [ "$SIZE" -lt 512000 ]; then
            echo "结论：产物过小，构建不完整" | tee -a build.log
            exit 1
          fi
          sha256sum outputs/NearbyLanToolbox.exe \
            | awk '{print $1"  NearbyLanToolbox.exe"}' > release-checksum.txt
          echo "SHA256：$(cat release-checksum.txt)" | tee -a build.log
          echo "结论：构建成功" | tee -a build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exe
          if-no-files-found: ignore
          path: |
            outputs/NearbyLanToolbox.exe
            release-checksum.txt
            *.log

      # Actions 的 job 日志接口对公开仓库也要求认证，job summary 与注解也不总是
      # 可靠可读。把日志推到独立分支后，可以直接用 raw 地址匿名读取，
      # 这是唯一 100% 稳定的诊断通道。
      - name: 导出构建日志到 ci-logs 分支
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          rm -rf /tmp/cilogs && mkdir -p /tmp/cilogs
          cp ./*.log /tmp/cilogs/ 2>/dev/null || true
          cd /tmp/cilogs
          {
            echo "# run $GITHUB_RUN_NUMBER"
            echo ""
            echo "- ref: $GITHUB_REF ($GITHUB_REF_TYPE)"
            echo "- sha: $GITHUB_SHA"
            echo "- 触发: $GITHUB_EVENT_NAME"
          } > README.md
          git init -q -b ci-logs
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci"
          git add -A
          git commit -q -m "run $GITHUB_RUN_NUMBER 构建日志" || echo "(无改动)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
          echo "日志已推到 ci-logs 分支"

  # ---------- macOS / Linux：打包跨平台发布包 ----------
  unix-packages:
    name: 打包 macOS / Linux 发布包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 单元测试（跨平台模块）
        run: |
          node tools/test-arp-parser.js
          node tools/test-access.js

      - name: 打包
        run: python3 tools/pack-release.py

      - name: 校验压缩包里的可执行权限位
        run: |
          python3 - <<'PY'
          import sys, tarfile, zipfile

          failed = False
          with zipfile.ZipFile("outputs/NearbyLanToolbox-mac.zip") as z:
              for info in z.infolist():
                  if info.filename.endswith((".command", ".sh")):
                      mode = (info.external_attr >> 16) & 0o777
                      ok = bool(mode & 0o100)
                      failed |= not ok
                      print(f"{'OK ' if ok else 'BAD'} {oct(mode)}  {info.filename}")

          with tarfile.open("outputs/NearbyLanToolbox-linux.tar.gz") as t:
              for member in t.getmembers():
                  if member.name.endswith((".command", ".sh")):
                      ok = bool(member.mode & 0o100)
                      failed |= not ok
                      print(f"{'OK ' if ok else 'BAD'} {oct(member.mode)}  {member.name}")

          if failed:
              sys.exit("压缩包里缺少可执行位，macOS/Linux 用户解压后无法双击启动")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: unix
          if-no-files-found: error
          path: outputs/*

  # ---------- 汇总发版 ----------
  # 只在「标签触发」或「手动触发」时发版；push 到 main 的构建不发版，
  # 方便反复验证构建链路而不制造 Release。
  release:
    name: 创建 Release
    needs: [windows-exe, unix-packages]
    if: always() && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "将要发布的 tag：$TAG"
          echo "目标仓库：$REPO"
          ls -la dist
          if [ -z "$(ls -A dist)" ]; then
            echo "没有任何构建产物，放弃发布"
            exit 1
          fi
          # 必须显式指定 --repo：本 job 没有 checkout，工作目录不是 git 仓库，
          # 不指定时 gh 会报「not a git repository」而失败。
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release 已存在，改为覆盖上传产物"
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "近邻 · 局域网工具箱 $TAG" \
              --generate-notes \
              dist/*
          fi

      - name: 结果
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release view "$TAG" --repo "$REPO"
