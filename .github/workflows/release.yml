name: Build & Release

# 触发方式：
#   · push 到 main      -> 只构建、不发版（用于验证构建链路）
#   · push v* 标签      -> 构建 + 创建/更新 Release
#   · 手动 workflow_dispatch -> 可指定 tag，勾选 dry_run 时只构建不发版
#
# 为什么不在这里删标签重建：反复删除并重建同一个 tag 会让已发布的 Release
# 一起消失（本项目踩过这个坑）。要重新发版请推新 tag，或走手动触发。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/更新的 tag（如 v1.7）"
        required: true
      dry_run:
        description: "只构建，不创建 Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ---------- Windows：编译单文件 exe ----------
  windows-exe:
    name: 构建 Windows exe
    runs-on: windows-latest
    # exe 构建失败不阻塞 mac / linux 发布。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # 环境信息写进 job summary。
      # Actions 的 job 日志接口对公开仓库也要求认证，外部拿不到；
      # job summary 是少数无需登录即可读取的通道，诊断必须依赖它。
      - name: 记录构建环境
        shell: bash
        run: |
          {
            echo "## 构建环境"
            echo ""
            echo '```text'
            echo "runner OS : $RUNNER_OS"
            echo "repo      : $GITHUB_REPOSITORY"
            echo "ref       : $GITHUB_REF  ($GITHUB_REF_TYPE)"
            echo "sha       : $GITHUB_SHA"
            echo ""
            echo "--- 顶层目录 ---"
            ls -la
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 用 Start-Process 而不是 `& script | Tee-Object`：
      # PowerShell 5.1 的流捕获在脚本内部 throw 时会丢内容，导致「日志是空的、
      # 只看到失败」这种没法定位的局面。Start-Process 能把 stdout / stderr 和
      # 真实退出码分别落到文件里，可靠得多。
      - name: 1/3 还原依赖
        shell: powershell
        run: |
          $out = "01-fetch-deps.out.log"
          $err = "01-fetch-deps.err.log"
          $p = Start-Process -FilePath "powershell" -NoNewWindow -Wait -PassThru `
                -ArgumentList @("-NoProfile","-ExecutionPolicy","Bypass","-File",".\tools\fetch-deps.ps1") `
                -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "fetch-deps 退出码: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 检查依赖布局
        if: always()
        shell: bash
        run: |
          {
            echo "## 依赖布局"
            echo ""
            echo '```text'
            echo "--- deps 顶层 ---"
            ls -la deps/ 2>&1 || echo "(deps 不存在)"
            echo ""
            echo "--- deps/*.dll ---"
            ls -la deps/*.dll 2>&1 || echo "(没有 dll)"
            echo ""
            echo "--- reference-assemblies 下的 targets 文件 ---"
            find deps/reference-assemblies -name "*.targets" 2>/dev/null | head -20 || echo "(无)"
            echo ""
            echo "--- reference-assemblies 下的 mscorlib.dll ---"
            find deps/reference-assemblies -name "mscorlib.dll" 2>/dev/null | head -20 || echo "(无)"
            echo ""
            echo "--- reference-assemblies 前 3 层 ---"
            find deps/reference-assemblies -maxdepth 3 2>/dev/null | head -40 || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 2/3 内嵌前端资源
        shell: powershell
        run: |
          $out = "02-embed-assets.out.log"
          $err = "02-embed-assets.err.log"
          $p = Start-Process -FilePath "powershell" -NoNewWindow -Wait -PassThru `
                -ArgumentList @("-NoProfile","-ExecutionPolicy","Bypass","-File",".\tools\embed-assets.ps1") `
                -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "embed-assets 退出码: $($p.ExitCode)"
          if (-not (Test-Path "native\EmbeddedAssets.g.cs")) {
            Write-Host "未生成 native\EmbeddedAssets.g.cs"
            exit 1
          }
          $info = Get-Item "native\EmbeddedAssets.g.cs"
          Write-Host ("EmbeddedAssets.g.cs: {0:N0} 字节" -f $info.Length)

      # 独立兜底：确认 exe 会嵌进去的前端，就是 public/ 里当前的版本。
      # 用 Node 而不是 PowerShell —— 出问题的恰恰是那个运行时。
      - name: 校验内嵌资源与 public 一致
        shell: bash
        run: node tools/verify-embedded-assets.js

      - name: 3/3 编译
        shell: powershell
        run: |
          $out = "03-msbuild.out.log"
          $err = "03-msbuild.err.log"
          $p = Start-Process -FilePath "powershell" -NoNewWindow -Wait -PassThru `
                -ArgumentList @("-NoProfile","-ExecutionPolicy","Bypass","-File",".\build.ps1","-SkipDeps","-SkipEmbed") `
                -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "build.ps1 退出码: $($p.ExitCode)"
          if (Test-Path "outputs\NearbyLanToolbox.exe") {
            Write-Host ("编译成功：{0:N0} 字节" -f (Get-Item "outputs\NearbyLanToolbox.exe").Length)
            exit 0
          }
          Write-Host "编译未产出 exe"
          exit 1

      - name: 校验产物并记录校验和
        if: success()
        shell: powershell
        run: |
          $exe = "outputs\NearbyLanToolbox.exe"
          $info = Get-Item $exe
          Write-Host ("大小：{0:N0} 字节" -f $info.Length)
          if ($info.Length -lt 500KB) { throw "产物过小，构建可能不完整" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NearbyLanToolbox.exe" | Out-File -Encoding utf8 release-checksum.txt
          Write-Host "SHA256：$hash"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exe
          if-no-files-found: ignore
          path: |
            outputs/NearbyLanToolbox.exe
            release-checksum.txt
            *.log

      # 无论成败都把各步骤日志尾部写进 job summary —— 这是无认证条件下
      # 唯一能稳定读到构建现场的方式。
      - name: 构建诊断（写入 job summary）
        if: always()
        continue-on-error: true
        shell: bash
        run: node tools/ci-diagnostics.js

  # ---------- macOS / Linux：打包跨平台发布包 ----------
  unix-packages:
    name: 打包 macOS / Linux 发布包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 单元测试（跨平台模块）
        run: |
          node tools/test-arp-parser.js
          node tools/test-access.js

      - name: 打包
        run: python3 tools/pack-release.py

      - name: 校验压缩包里的可执行权限位
        run: |
          python3 - <<'PY'
          import sys, tarfile, zipfile

          failed = False
          with zipfile.ZipFile("outputs/NearbyLanToolbox-mac.zip") as z:
              for info in z.infolist():
                  if info.filename.endswith((".command", ".sh")):
                      mode = (info.external_attr >> 16) & 0o777
                      ok = bool(mode & 0o100)
                      failed |= not ok
                      print(f"{'OK ' if ok else 'BAD'} {oct(mode)}  {info.filename}")

          with tarfile.open("outputs/NearbyLanToolbox-linux.tar.gz") as t:
              for member in t.getmembers():
                  if member.name.endswith((".command", ".sh")):
                      ok = bool(member.mode & 0o100)
                      failed |= not ok
                      print(f"{'OK ' if ok else 'BAD'} {oct(member.mode)}  {member.name}")

          if failed:
              sys.exit("压缩包里缺少可执行位，macOS/Linux 用户解压后无法双击启动")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: unix
          if-no-files-found: error
          path: outputs/*

  # ---------- 汇总发版 ----------
  # 只在「标签触发」或「手动触发」时发版；push 到 main 的构建不发版，
  # 方便反复验证构建链路而不制造 Release。
  release:
    name: 创建 Release
    needs: [windows-exe, unix-packages]
    if: always() && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "将要发布的 tag：$TAG"
          echo "目标仓库：$REPO"
          ls -la dist
          if [ -z "$(ls -A dist)" ]; then
            echo "没有任何构建产物，放弃发布"
            exit 1
          fi
          # 必须显式指定 --repo：本 job 没有 checkout，工作目录不是 git 仓库，
          # 不指定时 gh 会报「not a git repository」而失败。
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release 已存在，改为覆盖上传产物"
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "近邻 · 局域网工具箱 $TAG" \
              --generate-notes \
              dist/*
          fi

      - name: 结果
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release view "$TAG" --repo "$REPO"
